[appearance.icon]
app_icon = "glow"

[appearance.themes]
theme = "phenomenon"
selected_system_themes = { dark = "dracula", light = "light" }
system_theme = false

[appearance.text]
ai_font_name = "Monaspace Neon Var"
match_ai_font = true
font_name = "Monaspace Neon Var"
line_height_ratio = 1.600000023841858
font_weight = "bold"
notebook_font_size = 14.0
font_size = 14.0

[appearance.vertical_tabs]
enabled = true

[appearance.full_screen_apps]
alt_screen_padding = { custom = { uniform_padding = 0.0 } }

[appearance.panes]
should_dim_inactive_panes = true

[appearance.cursor]
cursor_display_type = "bar"

[appearance.window]
zoom_level = 100

[agents]
cloud_conversation_storage_enabled = true

[agents.warp_agent.input]
nld_in_terminal_enabled = false
ai_auto_detection_enabled = false

[agents.warp_agent.other]
should_render_use_agent_toolbar_for_user_commands = false

[agents.profiles]
agent_mode_execute_readonly_commands = true

[agents.execution_profiles.default]
apply_code_diffs = "agent_decides"
ask_user_question = "always_ask"
autosync_plans_to_warp_drive = true
command_allowlist = []
command_denylist = [
  'bash(\s.*)?', 'fish(\s.*)?', 'pwsh(\s.*)?', 'sh(\s.*)?', 'zsh(\s.*)?',
  'curl(\s.*)?', 'eval(\s.*)?', 'exec(\s.*)?', 'source(\s.*)?', 'wget(\s.*)?',
  'dig(\s.*)?', 'nslookup(\s.*)?', 'host(\s.*)?', 'ssh(\s.*)?', 'scp(\s.*)?',
  'rsync(\s.*)?', 'telnet(\s.*)?', 'rm(\s.*)?',
]
computer_use = "never"
directory_allowlist = []
execute_commands = "always_ask"
mcp_allowlist = []
mcp_denylist = []
mcp_permissions = "agent_decides"
name = "Default"
read_files = "agent_decides"
run_agents = "always_ask"
web_search_enabled = true
write_to_pty = "always_ask"

[privacy]
crash_reporting_enabled = true
telemetry_enabled = true

[terminal]
osc52_clipboard_access = "write_only"

[terminal.input]
honor_ps1 = false
alias_expansion_enabled = true
input_box_type_setting = "universal"

[notifications]
toast_duration_secs = 8

[notifications.preferences]
is_agent_task_completed_enabled = true
is_long_running_enabled = true
is_needs_attention_enabled = true
long_running_threshold = 30
mode = "enabled"
play_notification_sound = true

[code.indexing]
agent_mode_codebase_context_auto_indexing = true
